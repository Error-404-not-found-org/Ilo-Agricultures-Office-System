name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching mobile/app.json (for example, v1.0.4)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and release Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Require main and validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Android releases may only be run from main; received $GITHUB_REF." >&2
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must use the exact vX.Y.Z format." >&2
            exit 1
          fi

          APP_VERSION="$(node -e "const app = require('./mobile/app.json'); process.stdout.write(app.expo.version ?? '')")"
          if [[ "${RELEASE_TAG#v}" != "$APP_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match mobile/app.json expo.version $APP_VERSION." >&2
            exit 1
          fi

          RELEASE_HTTP_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          if [[ "$RELEASE_HTTP_STATUS" == "200" ]]; then
            echo "GitHub Release $RELEASE_TAG already exists." >&2
            exit 1
          elif [[ "$RELEASE_HTTP_STATUS" != "404" ]]; then
            echo "Unable to verify whether GitHub Release $RELEASE_TAG exists (HTTP $RELEASE_HTTP_STATUS)." >&2
            exit 1
          fi

          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1
          TAG_CHECK_STATUS=$?
          set -e
          if [[ "$TAG_CHECK_STATUS" -eq 0 ]]; then
            echo "Git tag $RELEASE_TAG already exists." >&2
            exit 1
          elif [[ "$TAG_CHECK_STATUS" -ne 2 ]]; then
            echo "Unable to verify whether Git tag $RELEASE_TAG exists." >&2
            exit "$TAG_CHECK_STATUS"
          fi

          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "Checked-out commit does not match the workflow commit $GITHUB_SHA." >&2
            exit 1
          fi

      - name: Install Mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Check Mobile TypeScript
        working-directory: mobile
        run: npx tsc --noEmit --pretty false

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build production Android APK
        working-directory: mobile
        run: |
          set -euo pipefail
          eas build \
            --platform android \
            --profile production-apk \
            --wait \
            --json \
            --non-interactive > ../eas-build-result.json

      - name: Validate EAS result and locate artifact
        id: eas-result
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const result = JSON.parse(fs.readFileSync('eas-build-result.json', 'utf8'));
          const builds = Array.isArray(result) ? result : [result];
          const build = builds.find((candidate) => candidate?.platform === 'ANDROID');

          if (!build?.id) {
            throw new Error('The EAS result does not contain an Android build ID.');
          }
          if (build.status !== 'FINISHED') {
            throw new Error(`EAS build ${build.id} did not finish successfully (status: ${build.status ?? 'missing'}).`);
          }
          const artifactUrl = build.artifacts?.buildUrl;
          if (!artifactUrl) {
            throw new Error(`EAS build ${build.id} does not contain an artifact buildUrl.`);
          }
          if (new URL(artifactUrl).protocol !== 'https:') {
            throw new Error(`EAS build ${build.id} returned a non-HTTPS artifact URL.`);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `build_id=${build.id}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `artifact_url=${artifactUrl}\n`);
          NODE

      - name: Download and validate APK
        env:
          ARTIFACT_URL: ${{ steps.eas-result.outputs.artifact_url }}
        run: |
          set -euo pipefail
          if [[ -z "$ARTIFACT_URL" ]]; then
            echo "EAS artifact URL is absent." >&2
            exit 1
          fi

          mkdir -p release
          curl -fL --retry 3 --retry-all-errors \
            --output release/BreedSmart-latest.apk \
            "$ARTIFACT_URL"

          APK_SIZE="$(stat -c%s release/BreedSmart-latest.apk)"
          if [[ "$APK_SIZE" -lt 1048576 ]]; then
            echo "Downloaded artifact is too small to be a valid APK ($APK_SIZE bytes)." >&2
            exit 1
          fi

          APK_MAGIC="$(od -An -tx1 -N4 release/BreedSmart-latest.apk | tr -d ' \n')"
          if [[ "$APK_MAGIC" != "504b0304" ]]; then
            echo "Downloaded artifact is not a ZIP/APK binary." >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            release/BreedSmart-latest.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "BreedSmart $RELEASE_TAG" \
            --generate-notes
